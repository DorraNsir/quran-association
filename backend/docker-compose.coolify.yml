services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://quran:${POSTGRES_PASSWORD}@db:5432/quran
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      TRUST_PROXY: 1
      FILE_STORAGE_ROOT: /data/uploads
    volumes:
      - uploads:/data
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  uploads:
  pgdata:
